<!doctype html>
<html>
  <head>
    <title>Ezra Guerrero Alvarez</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/index.css" />
    <meta name="author" content="Ezra Guerrero" />
    <meta
      name="description"
      content="Ezra Guerrero Alvarez is a first-year PhD student 
      in Mathematics at USC. This is his personal website and portfolio."

      content="Mathematics, Geometric Topology, Topology, Physics, Geometry, Geometric Analysis, USC, MIT, portfolio"
    />
    <script type="text/javascript" src="JS/index.js"></script>
    <script id="onload">
      document.addEventListener(
        "DOMContentLoaded",
        (loadContent = () => {
          var root = document.querySelector(":root");
          root.style.setProperty("--headshot", `url(${picture})`);
          document.getElementById("textbox").innerHTML += description;
        }),
      );
    </script>
  </head>
  <body>
    <div id="webpage">
      <script src="JS/elements/navbar.js"></script>
      <div id="content">
        <div id="picturebox">
          <div id="pictureheadshot"></div>
        </div>
        <div id="textbox"></div>
      </div>
    </div>
  </body>
